  <text x="100" y="118" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="18" font-weight="normal" fill="#7A8B9A" text-anchor="start">一台电脑跑全部服务；客户端只访问 5173；不需要云服务器，也不需要独立数据库服务器</text>
