name: CI

# 触发时机：向 main 提 PR 必跑；推功能分支也跑，便于自己先看到红灯
on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "ci/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

# 同一分支连续推送时，取消上一次未跑完的任务，省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: mvn verify
        run: mvn -B -ntp verify

      # 测试报告即使失败也上传，方便在 Actions 页面下载查看
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  compose:
    name: deploy (compose config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 只做静态校验：解析语法、变量插值、服务依赖，不拉镜像也不起容器
      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: List resolved services
        run: docker compose -f deploy/docker-compose.yml config --services

# 后续接入计划（不在本轮范围）：
# - 第 2 轮 C 落地 frontend 后，增加 pnpm install / build 任务
# - 第 3 轮起增加后端集成测试（需要 MySQL 服务容器）
