  <rect x="1664" y="515" width="580" height="120" rx="10" ry="10" fill="#E8EEF5"/>
  <rect x="1660" y="510" width="580" height="120" rx="10" ry="10" fill="#FFFFFF" stroke="#C4D6E7" stroke-width="2"/>
