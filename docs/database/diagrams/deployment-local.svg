  <rect x="580" y="720" width="860" height="110" rx="10" ry="10" fill="#FFFFFF" stroke="#C4D6E7" stroke-width="2"/>
  <rect x="580" y="720" width="8" height="110" rx="4" ry="4" fill="#2E75B6"/>
  <text x="604" y="758" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="bold" fill="#1F2D3D" text-anchor="start">Vite 开发服务器</text>
  <text x="604" y="786" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" font-weight="normal" fill="#7A8B9A" text-anchor="start">0.0.0.0:5173，/api 反向代理到 8080</text>
  <rect x="1326.0" y="736" width="100.0" height="26" rx="13" ry="13" fill="#2E75B6"/>
  <text x="1376.0" y="754" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">唯一对外端口</text>
  <rect x="1664" y="335" width="580" height="120" rx="10" ry="10" fill="#E8EEF5"/>
  <rect x="1660" y="330" width="580" height="120" rx="10" ry="10" fill="#FFFFFF" stroke="#C4D6E7" stroke-width="2"/>
  <rect x="1660" y="330" width="8" height="120" rx="4" ry="4" fill="#2E75B6"/>
  <text x="1684" y="368" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="bold" fill="#1F2D3D" text-anchor="start">电脑 B</text>
  <text x="1684" y="396" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" font-weight="normal" fill="#7A8B9A" text-anchor="start">医生 + 药师</text>
  <rect x="2165.0" y="346" width="61.0" height="26" rx="13" ry="13" fill="#2E75B6"/>
