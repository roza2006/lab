# 测试专用配置（只作用于 src/test，不会进入生产包）
# 使用 H2 内存库的 MySQL 兼容模式，避免接口测试依赖外部 MySQL 实例。
spring:
  datasource:
    url: jdbc:h2:mem:medical_platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  flyway:
    enabled: false

# 固定测试密钥，仅用于测试；生产必须通过 JWT_SECRET 覆盖
app:
  jwt:
    secret: test-only-secret-key-do-not-use-outside-tests-2026
    expiration-minutes: 30

logging:
  level:
    root: WARN
    com.medical.platform: INFO
