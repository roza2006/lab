# 本地开发编排：MySQL 8 + Redis 7 + Spring Boot 后端
#
# 用法（在仓库根目录执行）：
#   docker compose -f deploy/docker-compose.yml up -d --build    # 首次构建并后台启动
#   docker compose -f deploy/docker-compose.yml ps               # 查看容器状态
#   docker compose -f deploy/docker-compose.yml logs -f backend  # 跟踪后端日志
#   docker compose -f deploy/docker-compose.yml down             # 停止（保留数据卷）
#   docker compose -f deploy/docker-compose.yml down -v          # 停止并删除数据卷
#
# 约定：
# - 仓库内不出现真实密码；可调项统一用 ${VAR:-默认值} 覆盖，默认值仅供本地演示。
# - 数据只落在命名卷里，不写进仓库；.env 已在 .gitignore 中，可本地自行创建。

name: medical-platform

services:
  mysql:
    image: mysql:8.0
    container_name: medical-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-medical_platform}
      MYSQL_PWD: ${DB_ROOT_PASSWORD:-root}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: medical-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: medical-platform-backend:local
    container_name: medical-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-medical_platform}
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FLYWAY_ENABLED: "false"
      TZ: Asia/Shanghai
    ports:
      - "${SERVER_PORT:-8080}:8080"
    # healthcheck 留到第 3 轮：当前 /actuator/health 受 Spring Security 默认保护，
    # A 放行 health 端点后再补上，避免这里写死一个必然失败的探针。

volumes:
  mysql-data:
  redis-data:
