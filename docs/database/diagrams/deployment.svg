  <text x="1316" y="870" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="14" fill="#7A8B9A" text-anchor="start" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">Outbox 异步投递</text>
  <text x="100" y="1130" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="20" font-weight="bold" fill="#1F4E79" text-anchor="start">部署要点</text>
  <text x="100" y="1170" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="normal" fill="#1F2D3D" text-anchor="start">① 全站 HTTPS：TLS 在 Nginx 终止，应用区与数据区之间只走内网，端口不对外暴露。</text>
  <text x="100" y="1204" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="normal" fill="#1F2D3D" text-anchor="start">② 应用无状态：会话放 Redis，文件放对象存储，实例可水平扩容；数据库变更由 Flyway 管理。</text>
  <text x="100" y="1238" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="normal" fill="#1F2D3D" text-anchor="start">③ 跨系统调用不阻塞主事务：处方流转写入 outbox_event，由后台任务投递药房，失败指数退避重试。</text>
  <text x="100" y="1272" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="17" font-weight="normal" fill="#1F2D3D" text-anchor="start">④ 数据区主从分离读写；备份加密后异地保存；审计日志独立归档，保留不少于 6 个月。</text>
</svg>
