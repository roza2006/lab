  <rect x="1010" y="540" width="8" height="120" rx="4" ry="4" fill="#BF9000"/>
  <text x="1034" y="578" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="21" font-weight="bold" fill="#1F2D3D" text-anchor="start">Redis 7</text>
  <text x="1034" y="606" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="15" font-weight="normal" fill="#7A8B9A" text-anchor="start">127.0.0.1:6379</text>
  <rect x="1338.0" y="556" width="48.0" height="26" rx="13" ry="13" fill="#BF9000"/>
  <text x="1362.0" y="574" font-family="Microsoft YaHei,Segoe UI,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">预留</text>
